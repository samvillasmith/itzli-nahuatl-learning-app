name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare software notices for the installed platform
        run: node scripts/prepare-third-party-notices.cjs --prepare
      - run: npm run verify:v3
      - run: npm run images:openai:audit
